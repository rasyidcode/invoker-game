<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dota 2 - Invoker Game</title>
    <meta name="description" content="Fast-paced reaction and muscle-memory training game for Dota 2 Invoker spells.">
    <link rel="shortcut icon" href="favicon.ico">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #0b0d12;
        color: #e0e0e0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
      }
      canvas.emscripten {
        border: 0 none;
        background-color: #000000;
        outline: none;
        width: min(calc(96vh * (9 / 16)), 96vw) !important;
        height: min(96vh, calc(96vw * (16 / 9))) !important;
        max-width: 96vw;
        max-height: 96vh;
        aspect-ratio: 9 / 16;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 210, 255, 0.15);
      }
      #loading {
        position: absolute;
        color: #d4af37;
        font-size: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: bold;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="loading">Loading Invoker Arsenal...</div>
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script type="text/javascript">
      // Prevent browser default scroll for game keys (Space, Arrows, Tab)
      window.addEventListener("keydown", function(e) {
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab"].indexOf(e.code) > -1) {
          e.preventDefault();
        }
      }, { passive: false });

      var Module = {
        preRun: [],
        postRun: [
          function() {
            var loader = document.getElementById('loading');
            if (loader) loader.style.display = 'none';
            var canvas = document.getElementById('canvas');
            if (canvas) {
              canvas.focus();
            }
          }
        ],
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          // Focus canvas automatically on click so keystrokes register immediately
          window.addEventListener('click', function() { canvas.focus(); });
          return canvas;
        })()
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
